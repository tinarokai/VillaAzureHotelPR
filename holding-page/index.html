<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Temporarily Unavailable</title>
<style>
  :root { --bg: #f4f1ec; --fg: #1f2a33; --muted: #6b7178; }
  @media (prefers-color-scheme: dark) { :root { --bg: #14181c; --fg: #e9e6e0; --muted: #9aa0a6; } }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: Georgia, "Times New Roman", serif; }
  main { min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 24px 16px; box-sizing: border-box; text-align: center; }
  h1 { font-weight: 400; font-size: 1.6rem; letter-spacing: .04em; margin: 0 0 12px; }
  p { color: var(--muted); font-size: 1rem; margin: 0; line-height: 1.5; }
</style>
</head>
<body>
<main>
  <div>
    <h1>This site is temporarily unavailable.</h1>
    <p>Please check back soon.</p>
  </div>
</main>
</body>
</html>
