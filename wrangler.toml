# Cloudflare Pages configuration for villaazurehotelpr.com.
# The site is the static HTML in public/; functions/ holds the contact endpoint.
#
# Secrets (never in this file), set with `wrangler pages secret put <NAME>`:
#   SUPABASE_SERVICE_ROLE_KEY   Supabase -> Project Settings -> API
#   EMAIL_API_TOKEN             Cloudflare API token with the Email Sending permission
#                               (only needed once villaazurehotelpr.com is a Cloudflare zone
#                               and `wrangler email sending enable villaazurehotelpr.com` has run;
#                               until then the form stores the enquiry and skips the email)
name = "villa-azure-hotel"
pages_build_output_dir = "public"
compatibility_date = "2026-05-07"

[vars]
SUPABASE_URL = "https://xewgcsmgexewehfcaslr.supabase.co"
CF_ACCOUNT_ID = "97480f45e49cdcee83ae5545af00c36a"
CONTACT_TO = "info@villaazurepr.com"
CONTACT_FROM = "notifications@villaazurehotelpr.com"
